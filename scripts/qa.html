<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>말결 메시지 자동 점검</title>
  <style>
    body { margin: 0 auto; max-width: 960px; padding: 24px 20px; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height: 1.5; color: #222; }
    table { border-collapse: collapse; margin: 12px 0; }
    th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; }
    td.num { text-align: right; }
    textarea { width: 100%; height: 360px; font: 13px/1.5 ui-monospace, Consolas, monospace; }
    button { padding: 8px 14px; font: inherit; cursor: pointer; }
    .muted { color: #666; font-size: 14px; }
    #showcase table { width: 100%; font-size: 14px; }
    #showcase td { vertical-align: top; white-space: pre-wrap; }
    .ok { color: #1a7f37; }
    .bad { color: #c62828; }
  </style>
</head>
<body>
  <!-- 내부 점검용 페이지 (앱 화면 아님). 로컬 서버로 열어야 한다: README '메시지 자동 점검' -->
  <h1>말결 메시지 자동 점검</h1>
  <p class="muted">문장 정리 엔진(engine.js)을 그대로 불러와 샘플 30건과 추가 사례를 받는 사람 4종 × 끝맺음 2종 × 요청 방식 3종 × [다시 만들기] 조합 3가지로 돌려 점검합니다. (외부 호출 없음)</p>
  <p id="status">점검 중…</p>
  <div id="summary"></div>
  <p>
    <button type="button" id="download" disabled>결과 .md 내려받기</button>
    <span class="muted">→ docs/qa/check-YYYYMMDD-before.md 또는 -after.md 로 저장</span>
  </p>
  <textarea id="markdown" readonly aria-label="점검 결과 마크다운"></textarea>

  <!-- 대표 결과: 시연·발표에 쓰는 샘플 6건의 실제 문장 (샘플에 적힌 받는 사람 · 합니다체 · 부드럽게) -->
  <section id="showcase">
    <h2>대표 결과 (q01 · q03 · r02 · r05 · s01 · s05)</h2>
    <p class="muted">샘플에 적힌 받는 사람 · 합니다체 · 부드럽게 · 처음 만든 결과(조합 0)</p>
    <div id="showcase-table"></div>
  </section>

  <script>
    // engine.js는 앱에서 main.js가 넣어 주는 DATA(cards.json)·SAMPLE_DATA를 참고한다. 점검에서는 여기서 넣는다.
    let DATA = null;
    let SAMPLE_DATA = null;
  </script>
  <script src="../content.js"></script>
  <script src="../engine.js"></script>
  <script src="check-messages.js"></script>
  <script>
    (async () => {
      const status = document.getElementById("status");
      try {
        const [cards, SAMPLES] = await Promise.all([
          fetch("../data/cards.json", { cache: "no-cache" }).then((r) => r.json()),
          fetch("../data/malgyeol_sample_data.json", { cache: "no-cache" }).then((r) => r.json()),
        ]);
        DATA = cards;
        SAMPLE_DATA = SAMPLES;
        const data = await runAll(cards, SAMPLES, generateMessages);
        const s = summarize(data);
        const date = new Date().toISOString().slice(0, 10);
        const md = toMarkdown(data, { title: `말결 메시지 자동 점검 (${date})`, date });
        // 문체 점검 (메시지 한 통 = 문체 하나)
        const tone = await runToneCheck(cards, SAMPLES, generateMessages);
        const toneMd = toneMarkdown(tone, { title: `말결 문체 점검 (${date})`, date });
        const unknownCount = Object.values(tone.unknown).reduce((a, u) => a + u.count, 0);

        document.getElementById("summary").innerHTML =
          "<table><tr><th>항목</th><th>문제 수</th><th>문제 난 메시지 수</th></tr>" +
          s.rows.map((r) => `<tr><td>${r.name}</td><td class="num">${r.count}</td><td class="num">${r.messages}</td></tr>`).join("") +
          `</table><p class="muted">메시지 ${s.messages}개 점검 · 탭 3종의 수정 이유가 모두 같은 생성: ${s.sameReasons}/${s.runs}회</p>` +
          `<h2>문체 점검</h2><p>문체 혼합 메시지 <strong>${tone.mixed.length}</strong> / ${tone.messages} · 변환 못 한 끝맺음 ${unknownCount}문장 · 수정 이유 해요체 아님 ${tone.reasonIssues.length}</p>`;
        document.getElementById("markdown").value = `${md}\n\n---\n\n${toneMd}`;
        status.textContent = "점검 완료";
        window.QA_RESULT = { summary: s, markdown: md, data, tone, toneMarkdown: toneMd };
        await renderShowcase(cards, SAMPLES);

        const download = document.getElementById("download");
        download.disabled = false;
        download.addEventListener("click", () => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([md], { type: "text/markdown" }));
          a.download = `check-${date.replace(/-/g, "")}.md`;
          a.click();
        });
      } catch (error) {
        status.textContent = "점검을 실행하지 못했어요. 로컬 서버로 열었는지 확인해 주세요. (" + error.message + ")";
        console.error(error);
      }
    })();

    // ---------- 대표 결과 ----------
    const SHOWCASE_IDS = ["q01", "q03", "r02", "r05", "s01", "s05"];
    const SHOWCASE_PROFILE = { sentenceLength: "normal", requestStyle: "soft", ending: "hamnida", avoidPhrases: "", preferredExamples: [] };
    const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    async function renderShowcase(cards, SAMPLES) {
      const partnerByLabel = Object.fromEntries(cards.partners.map((x) => [x.label, x]));
      const rows = [];
      for (const id of SHOWCASE_IDS) {
        const s = SAMPLES.samples.find((x) => x.id === id);
        const card = cards.cards.find((x) => x.id === s.cardId);
        const fields = Object.fromEntries(card.fields.map((f) => [f.key, s.fields[f.key] || null]));
        const out = await generateMessages({ card, fields, recipient: partnerByLabel[s.partner], profile: SHOWCASE_PROFILE, preferred: [] });
        out.variants.forEach((v) => rows.push({ id, card: card.name, partner: s.partner, tab: TAB_LABEL[v.type], text: v.text, reasons: v.reasons }));
      }
      document.getElementById("showcase-table").innerHTML =
        "<table><tr><th>샘플</th><th>탭</th><th>문장</th><th>수정 이유</th></tr>" +
        rows
          .map((r) => `<tr><td>${r.id}<br><span class="muted">${escapeHtml(r.card)} · ${escapeHtml(r.partner)}</span></td><td>${r.tab}</td><td>${escapeHtml(r.text)}</td><td>${escapeHtml(r.reasons.join("\n"))}</td></tr>`)
          .join("") +
        "</table>";
      window.QA_SHOWCASE = rows;
    }
  </script>
</body>
</html>
