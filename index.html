<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>말결</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button type="button" class="logo" id="go-home">말결</button>
    <button type="button" class="link-button" id="go-profile">내 말투</button>
  </header>

  <!-- 화면 1 · 홈 -->
  <main class="screen" id="screen-home">
    <div class="banner" id="profile-banner" hidden>
      <button type="button" class="banner-main" id="banner-setup">30초 만에 내 말투 설정하기</button>
      <button type="button" class="banner-skip" id="banner-skip">건너뛰기</button>
    </div>

    <h1>어떤 말을 전하고 싶나요?</h1>

    <div class="cards" id="card-list"></div>

    <label class="input-label" for="home-input">한 줄로 적어 주세요</label>
    <textarea id="home-input" rows="3" placeholder="먼저 위에서 상황 카드를 골라 주세요" disabled></textarea>
    <p class="security-note">클라이언트명·금액 등 기밀 정보는 'A사', 'X원'처럼 바꿔 입력하세요.</p>

    <button type="button" class="primary" id="home-submit" disabled>정리하기</button>
  </main>

  <!-- 화면 2 · 구조화 확인 -->
  <main class="screen" id="screen-structure" hidden>
    <h1>구조화 확인</h1>
    <p class="summary"><strong id="structure-card"></strong> · <span id="structure-input"></span></p>

    <section class="block">
      <h2 class="block-title">받는 사람 <span class="required">*</span></h2>
      <div class="chips" id="recipient-list"></div>
    </section>

    <section class="block">
      <h2 class="block-title">내용 확인</h2>
      <p class="block-desc"><span class="required">*</span> 표시는 꼭 채워야 해요. 노란 칸은 아직 비어 있어요.</p>
      <div id="field-list"></div>
      <p class="security-note">클라이언트명·금액 등 기밀 정보는 'A사', 'X원'처럼 바꿔 입력하세요.</p>
    </section>

    <div class="actions">
      <button type="button" class="secondary" data-go="home">← 홈으로</button>
      <button type="button" class="primary" id="make-message" disabled>메시지 만들기</button>
    </div>
  </main>

  <!-- 화면 3 · 결과 (다음 단계에서 구현) -->
  <main class="screen" id="screen-result" hidden>
    <h1>결과</h1>
    <p class="placeholder">준비 중인 화면입니다. 확정된 내용은 아래와 같아요.</p>
    <pre class="debug" id="result-debug"></pre>
    <button type="button" class="secondary" data-go="home">← 홈으로</button>
  </main>

  <!-- 화면 4 · 내 말투 (다음 단계에서 구현) -->
  <main class="screen" id="screen-profile" hidden>
    <h1>내 말투</h1>
    <p class="placeholder">준비 중인 화면입니다.</p>
    <button type="button" class="secondary" data-go="home">← 홈으로</button>
  </main>

  <script src="ai.js"></script>
  <script src="main.js"></script>
</body>
</html>
